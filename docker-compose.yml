version: '3.8'

services:
  backend-go:
    build: ./backend-go
    container_name: kosan-backend
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
    networks:
      - kosan-network

  bot-python:
    build: ./bot-python
    container_name: kosan-bot
    ports:
      - "5000:5000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - BACKEND_URL=http://backend-go:8080
    depends_on:
      - backend-go
    networks:
      - kosan-network

networks:
  kosan-network:
    driver: bridge
